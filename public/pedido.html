<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Ju - Fazer Pedido</title>
</head>
<body>
    <header>
        <h1>Fazer pedido</h1>
        <nav>
            <ul>
                <li><a href="index.html">Voltar pro cardápio</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <form action="/pedidos" method="post">
            <fieldset>
                <legend>Seu dados</legend>
                <p>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" required>
                </p>
                <p>
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required>
                </p>
            </fieldset>
            <fieldset>
                <legend>Entrega</legend>
                <p>
                    <label for="bairro">Bairro</label>
                    <select id="bairro" name="bairro" required>
                        <option value="">Escolha o bairro</option>
                        <option value="rio-vermelho">Rio Vermelho (taxa R$ 5,00)</option>
                        <option value="barra">Barra (taxa R$ 6,00)</option>
                        <option value="pituba">Pituba (taxa R$ 7,00)</option>
                        <option value="itapua">Itapuã (taxa R$ 9,00)</option>
                    </select>
                </p>
                <p>
                    <label for="endereco">Endereço (rua, número e complemento)</label>
                    <textarea name="endereco" id="endereco" rows="2" required></textarea>
                </p>
            </fieldset>
            <fieldset>
                <legend>Itens</legend>
                <p>
                    <label for="qtd-acaraje">Acarajé (R$ 12,00)</label>
                    <input type="number" id="qtd-acaraje" name="itens[acaraje]" min="0" max="20" value="0">
                </p>
                <p>
                    <label for="qtd-bobo">Bobo de camarão (R$ 38,00)</label>
                    <input type="number" id="qtd-bobo" name="itens[bobo]" min="0" max="20" value="0">
                </p>
                <p>
                    <label for="qtd-abara">Abará (R$ 10,00)</label>
                    <input type="number" id="qtd-abara" name="itens[abara]" min="0" max="20" value="0">
                </p>
                <p>
                    <label for="qtd-vatapa">Vatapá (R$ 15,00)</label>
                    <input type="number" id="qtd-vatapa" name="itens[vatapa]" min="0" max="20" value="0">
                </p>
                <p>
                    <label for="qtd-cocada">Cocada (R$ 6,00)</label>
                    <input type="number" id="qtd-cocada" name="itens[cocada]" min="0" max="20" value="0">
                </p>
                <p>
                    <label for="qtd-moqueca-de-peixe">Moqueca de peixe (R$ 42,00)</label>
                    <input type="number" id="qtd-moqueca-de-peixe" name="itens[moqueca-de-peixe]" min="0" max="20" value="0">
                </p>
            </fieldset>
            <fieldset>
                <legend>Pagamento</legend>
                <p>
                    <label for="">Forma de pagamento (na entrega)</label>
                    <select name="forma_pagamento" id="pagamento" required>
                        <option value="">Escolha</option>
                        <option value="dinheiro">Dinheiro</option>
                        <option value="pix">Pix</option>
                    </select>
                </p>
                <p>
                    <label for="cupom">Cupom (opcional)</label>
                    <input type="text" id="cupom" name="cupom" maxlength="20" placeholder="PRIMEIRA10">
                </p>
            </fieldset>
            <button type="submit">Enviar pedido</button>
        </form>
    </main>
    <footer></footer>
</body>
</html>
